name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data/keepers.json against the schema
        run: node scripts/validate.mjs
      - name: Date-math and validator tests
        run: node --test test/
